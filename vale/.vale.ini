StylesPath = styles
MinAlertLevel = suggestion
Packages = ai-tells, https://github.com/tbhb/vale-ai-tells/releases/latest/download/ai-tells-commits.zip

# Stock ai-tells: every rule at its shipped level, no overrides. The repo's own
# prose conforms (2026-09-16). The edit hook relays error-level alerts, which is all of them.

# Prose, code comments, and the commit-message buffer. The hook lints prose files only;
# /deslop passes code files explicitly.
[{*.md,*.mdx,*.markdown,*.txt,*.py,*.rb,*.ts,*.tsx,*.js,*.go,*.sh,COMMIT_EDITMSG}]
BasedOnStyles = ai-tells, deslop

# Commit messages and PR bodies, reached via stdin: vale --ext=.md --path=COMMIT_EDITMSG
[COMMIT_EDITMSG]
BasedOnStyles = ai-tells, ai-tells-commits, deslop
# Git trailers, not prose: the harness requires the Co-Authored-By trailer, and
# "Trailer: Value" is the trailer format.
ai-tells-commits.CommitAttribution = NO
ai-tells.ColonUsage = NO
